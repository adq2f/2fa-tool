<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2FA Base32 → Base64</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #0a0e27;
        color: #fff;
        min-height: 100vh;
        padding: 15px;
    }
    .box {
        background: #fff;
        color: #1a1a1a;
        max-width: 950px;
        margin: 15px auto;
        padding: 25px;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    h1 {
        color: #1877f2;
        font-size: 18px;
        font-weight: 800;
        text-align: center;
        margin-bottom: 4px;
    }
    .subtitle {
        font-size: 11px;
        color: #999;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-align: center;
        margin-bottom: 18px;
        padding-bottom: 15px;
        border-bottom: 1px solid #eee;
    }
    .label {
        font-size: 11px;
        font-weight: 700;
        color: #555;
        margin-bottom: 8px;
        text-transform: uppercase;
    }
    textarea {
        width: 100%;
        padding: 14px;
        border: 2px solid #e5e5e5;
        border-radius: 12px;
        font-size: 12px;
        font-family: monospace;
        outline: none;
        resize: vertical;
        min-height: 150px;
        margin-bottom: 15px;
        background: #fafafa;
        line-height: 1.8;
    }
    textarea:focus { border-color: #1877f2; background: #fff; }

    .copy-all-sticky {
        position: sticky;
        top: 0;
        z-index: 100;
        background: #fff;
        padding: 10px 0;
        margin-bottom: 10px;
        border-bottom: 1px solid #eee;
    }
    .btn-copy-all {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #28a745, #1e7e34);
        color: #fff;
        border: none;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }
    .btn-copy-all:hover { transform: translateY(-2px); }
    .btn-copy-all:disabled { background: #ccc; cursor: not-allowed; }
    .btn-copy-all.copied { background: linear-gradient(135deg, #17a2b8, #117a8b); }
    .btn-copy-all svg { width: 16px; height: 16px; stroke: #fff; fill: none; stroke-width: 2.5; }

    .stats-row {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
        flex-wrap: wrap;
    }
    .stat-card {
        flex: 1;
        min-width: 90px;
        padding: 10px;
        border-radius: 10px;
        text-align: center;
        background: #f8f9fa;
        border: 1px solid #e9ecef;
    }
    .stat-card .number {
        font-size: 20px;
        font-weight: 800;
        color: #1877f2;
        display: block;
    }
    .stat-card .label-text {
        font-size: 9px;
        font-weight: 700;
        color: #999;
        text-transform: uppercase;
    }
    .stat-card.valid { background: #e8f5e9; }
    .stat-card.valid .number { color: #28a745; }
    .stat-card.wrong { background: #ffebee; }
    .stat-card.wrong .number { color: #dc3545; }
    .stat-card.dupe { background: #fff3e0; }
    .stat-card.dupe .number { color: #fd7e14; }

    .table-container {
        max-height: 60vh;
        overflow-y: auto;
        border-radius: 12px;
        border: 1px solid #eee;
        margin-bottom: 15px;
        background: #fff;
    }
    .result-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        font-size: 10px;
        table-layout: fixed;
    }
    .result-table th {
        background: linear-gradient(135deg, #1877f2, #0a4d9e);
        color: #fff;
        padding: 10px 8px;
        text-align: left;
        font-size: 9px;
        text-transform: uppercase;
        position: sticky;
        top: 0;
        z-index: 10;
    }
    .result-table td {
        padding: 10px 8px;
        border-bottom: 1px solid #f0f0f0;
        font-family: monospace;
        font-size: 10px;
        word-break: break-all;
        vertical-align: middle;
        background: #fff;
        line-height: 1.5;
    }
    .result-table .line-cell {
        color: #155724;
        font-weight: 700;
        max-width: 400px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .result-table .wrong-line-cell {
        color: #dc3545;
        font-weight: 700;
        max-width: 400px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .result-table .otp-cell {
        color: #1877f2;
        font-weight: 800;
        font-size: 14px;
        text-align: center;
        white-space: nowrap;
        padding: 10px 4px;
        background: #f0f7ff;
    }
    .result-table .wrong-otp-cell {
        color: #dc3545;
        font-weight: 800;
        font-size: 11px;
        text-align: center;
        white-space: nowrap;
        padding: 10px 4px;
        background: #ffebee;
    }
    .result-table .dupe-cell {
        color: #fd7e14;
        font-weight: 700;
        max-width: 400px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .result-table .copy-cell { text-align: center; padding: 6px; width: 50px; }
    .copy-icon-btn {
        background: linear-gradient(135deg, #28a745, #1e7e34);
        border: none;
        cursor: pointer;
        padding: 7px;
        border-radius: 7px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
    }
    .copy-icon-btn svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .copy-icon-btn.copied { background: linear-gradient(135deg, #17a2b8, #117a8b); }
    .copy-icon-btn.wrong-btn { background: linear-gradient(135deg, #dc3545, #a71e2a); }
    .copy-icon-btn:disabled { background: #e0e0e0; cursor: not-allowed; }
    .copy-icon-btn:disabled svg { stroke: #bbb; }
    .empty-msg {
        text-align: center;
        padding: 30px 20px;
        color: #bbb;
        font-size: 12px;
        background: #fafafa;
        border-radius: 12px;
        border: 2px dashed #e5e5e5;
        font-style: italic;
    }
    .result-table th:nth-child(1), .result-table td:nth-child(1) { width: 60%; }
    .result-table th:nth-child(2), .result-table td:nth-child(2) { width: 25%; }
    .result-table th:nth-child(3), .result-table td:nth-child(3) { width: 15%; }

    /* Popup */
    .popup {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(-150px);
        color: #fff;
        padding: 14px 22px;
        border-radius: 14px;
        font-weight: bold;
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 9999;
        opacity: 0;
        transition: all 0.5s;
        pointer-events: none;
        min-width: 240px;
        max-width: 90%;
        box-shadow: 0 12px 40px rgba(0,0,0,0.3);
    }
    .popup.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
    }
    .popup.success {
        background: linear-gradient(135deg, #28a745, #1e7e34);
        box-shadow: 0 12px 40px rgba(40,167,69,0.6);
    }
    .popup.info {
        background: linear-gradient(135deg, #1877f2, #0a4d9e);
        box-shadow: 0 12px 40px rgba(24,119,242,0.6);
    }
    .popup-icon {
        width: 30px;
        height: 30px;
        flex-shrink: 0;
    }
    .popup-text {
        display: flex;
        flex-direction: column;
        line-height: 1.3;
    }
    .popup-title {
        font-size: 14px;
        text-transform: uppercase;
    }
    .popup-msg {
        font-size: 12px;
        margin-top: 2px;
        opacity: 0.9;
    }
</style>
</head>
<body>

<!-- Popup -->
<div class="popup" id="popup">
    <svg class="popup-icon" id="popupIcon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3">
        <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <div class="popup-text">
        <span class="popup-title" id="popupTitle">Success</span>
        <span class="popup-msg" id="popupMsg"></span>
    </div>
</div>

<div class="box">
    <h1>🔐 2FA Base32 → Base64</h1>
    <div class="subtitle">Line by Line — Sheet Ready</div>

    <div class="label">Paste 2FA Keys (Line by Line)</div>
    <textarea id="inputData" placeholder="HD3T J6UX EL2Z WRP3&#10;7ZDU YGTD 5P3E LE7P&#10;AHGF XJSB TUII ORZ4" oninput="processData()"></textarea>

    <div class="stats-row" id="statsRow" style="display:none;">
        <div class="stat-card"><span class="number" id="totalCount">0</span><div class="label-text">Total</div></div>
        <div class="stat-card valid"><span class="number" id="validCount">0</span><div class="label-text">✅ Valid</div></div>
        <div class="stat-card wrong"><span class="number" id="wrongCount">0</span><div class="label-text">❌ Wrong</div></div>
        <div class="stat-card dupe"><span class="number" id="dupeCount">0</span><div class="label-text">🔄 Dupe</div></div>
    </div>

    <div class="copy-all-sticky" id="copyAllSticky" style="display:none;">
        <button class="btn-copy-all" id="copyAllBtn" onclick="copyAllValid()" disabled>
            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            COPY ALL BASE64 (LINE BY LINE)
        </button>
    </div>

    <div class="label">Result</div>
    <div id="resultContainer">
        <div class="empty-msg">Paste 2FA keys above to see results</div>
    </div>
</div>

<script>
function base32Decode(str) {
    const abc = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
    str = str.toUpperCase().replace(/=+$/, '').replace(/\s/g, '');
    if (!str.length) throw new Error('Empty');
    let bits = '';
    for (let i = 0; i < str.length; i++) {
        const v = abc.indexOf(str[i]);
        if (v === -1) throw new Error('Invalid');
        bits += v.toString(2).padStart(5, '0');
    }
    const bytes = [];
    for (let i = 0; i + 8 <= bits.length; i += 8) bytes.push(parseInt(bits.substr(i, 8), 2));
    if (!bytes.length) throw new Error('Invalid');
    return new Uint8Array(bytes);
}

function base64Encode(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    bytes.forEach(b => bin += String.fromCharCode(b));
    return btoa(bin);
}

function isBase32(str) {
    const clean = str.toUpperCase().replace(/=+$/, '').replace(/\s/g, '');
    if (clean.length < 16) return false;
    return /^[A-Z2-7]+$/.test(clean);
}

async function hmacSHA1(key, message) {
    const ck = await crypto.subtle.importKey('raw', key, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
    return new Uint8Array(await crypto.subtle.sign('HMAC', ck, message));
}

async function generateTOTP(keyBytes) {
    const epoch = Math.floor(Date.now() / 1000);
    const counter = Math.floor(epoch / 30);
    const buffer = new ArrayBuffer(8);
    const view = new DataView(buffer);
    view.setUint32(4, counter, false);
    const hmac = await hmacSHA1(keyBytes, buffer);
    const offset = hmac[hmac.length - 1] & 0x0f;
    const binary = ((hmac[offset] & 0x7f) << 24) | ((hmac[offset + 1] & 0xff) << 16) | ((hmac[offset + 2] & 0xff) << 8) | (hmac[offset + 3] & 0xff);
    return (binary % 1000000).toString().padStart(6, '0');
}

function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ============ SOUND ============
function playCopySound() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.15);
        setTimeout(() => ctx.close(), 500);
    } catch (e) {}
}

function playCopyAllSound() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [659, 784, 988, 1175];
        notes.forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.07);
            gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.07);
            gain.gain.linearRampToValueAtTime(0.12, ctx.currentTime + i * 0.07 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.07 + 0.15);
            osc.start(ctx.currentTime + i * 0.07);
            osc.stop(ctx.currentTime + i * 0.07 + 0.2);
        });
        setTimeout(() => ctx.close(), 1000);
    } catch (e) {}
}

// ============ POPUP ============
let popupTimer = null;
function showPopup(type, title, msg) {
    const popup = document.getElementById('popup');
    const popupTitle = document.getElementById('popupTitle');
    const popupMsg = document.getElementById('popupMsg');
    const popupIcon = document.getElementById('popupIcon');
    
    popup.className = 'popup ' + type;
    popupTitle.textContent = title;
    popupMsg.textContent = msg || '';
    
    if (type === 'success') {
        popupIcon.innerHTML = '<polyline points="20 6 9 17 4 12"></polyline>';
    } else {
        popupIcon.innerHTML = '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>';
    }
    
    popup.classList.add('show');
    if (popupTimer) clearTimeout(popupTimer);
    popupTimer = setTimeout(() => popup.classList.remove('show'), 3000);
}

// ============ GLOBAL ============
let rowsData = [];

async function processData() {
    const input = document.getElementById('inputData').value;
    const container = document.getElementById('resultContainer');
    const copyAllBtn = document.getElementById('copyAllBtn');
    const copyAllSticky = document.getElementById('copyAllSticky');
    const statsRow = document.getElementById('statsRow');

    const lines = input.split('\n').map(l => l.trim()).filter(l => l.length > 0);

    if (lines.length === 0) {
        container.innerHTML = '<div class="empty-msg">Paste 2FA keys above to see results</div>';
        copyAllBtn.disabled = true;
        copyAllSticky.style.display = 'none';
        statsRow.style.display = 'none';
        rowsData = [];
        return;
    }

    rowsData = [];
    const seenOriginal = new Set();
    const seenOutput = new Set();
    let validCount = 0, wrongCount = 0, dupeCount = 0;

    for (const line of lines) {
        if (seenOriginal.has(line)) {
            dupeCount++;
            rowsData.push({ original: line, output: '🔄 Duplicate', otp: 'Dupe', status: 'dupe' });
            continue;
        }
        seenOriginal.add(line);

        if (!isBase32(line)) {
            rowsData.push({ original: line, output: '⚠️ Wrong 2FA❗', otp: '⚠️ Wrong 2FA❗', status: 'wrong' });
            wrongCount++;
            continue;
        }

        let outputLine = '';
        let otp = '';

        try {
            const keyBytes = base32Decode(line);
            outputLine = base64Encode(line);
            otp = await generateTOTP(keyBytes);
        } catch (e) {
            rowsData.push({ original: line, output: '⚠️ Wrong 2FA❗', otp: '⚠️ Wrong 2FA❗', status: 'wrong' });
            wrongCount++;
            continue;
        }

        if (seenOutput.has(outputLine)) {
            dupeCount++;
            rowsData.push({ original: line, output: outputLine, otp: 'Dupe', status: 'dupe' });
            continue;
        }
        seenOutput.add(outputLine);

        rowsData.push({
            original: line,
            output: outputLine,
            otp: otp,
            status: 'valid'
        });

        validCount++;
    }

    document.getElementById('totalCount').textContent = lines.length;
    document.getElementById('validCount').textContent = validCount;
    document.getElementById('wrongCount').textContent = wrongCount;
    document.getElementById('dupeCount').textContent = dupeCount;
    statsRow.style.display = 'flex';
    copyAllSticky.style.display = 'block';

    renderTable(container, rowsData);
    copyAllBtn.disabled = false;
}

function renderTable(container, rowsData) {
    if (rowsData.length === 0) {
        container.innerHTML = '<div class="empty-msg">No data</div>';
        return;
    }

    let html = '<div class="table-container"><table class="result-table">';
    html += '<thead><tr><th>Base64 (Converted)</th><th>OTP</th><th>Copy</th></tr></thead><tbody>';

    rowsData.forEach((row, idx) => {
        html += '<tr>';
        if (row.status === 'valid') {
            html += '<td class="line-cell" title="' + escapeHtml(row.output) + '">' + escapeHtml(row.output) + '</td>';
            html += '<td class="otp-cell" id="otp-' + idx + '">' + row.otp + '</td>';
            html += '<td class="copy-cell"><button class="copy-icon-btn" id="btn-' + idx + '" onclick="copySingle(' + idx + ')"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button></td>';
        } else if (row.status === 'dupe') {
            html += '<td class="dupe-cell" title="' + escapeHtml(row.output) + '">' + escapeHtml(row.output) + '</td>';
            html += '<td class="dupe-cell">Dupe</td>';
            html += '<td class="copy-cell"><button class="copy-icon-btn" disabled><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button></td>';
        } else {
            html += '<td class="wrong-line-cell" title="' + escapeHtml(row.output) + '">' + escapeHtml(row.output) + '</td>';
            html += '<td class="wrong-otp-cell">⚠️ Wrong 2FA❗</td>';
            html += '<td class="copy-cell"><button class="copy-icon-btn wrong-btn" id="btn-' + idx + '" onclick="copySingle(' + idx + ')"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button></td>';
        }
        html += '</tr>';
    });

    html += '</tbody></table></div>';
    container.innerHTML = html;
}

function copySingle(idx) {
    const row = rowsData[idx];
    if (!row || row.status === 'dupe') return;
    navigator.clipboard.writeText(row.output).then(() => {
        playCopySound();
        const btn = document.getElementById('btn-' + idx);
        btn.classList.add('copied');
        setTimeout(() => btn.classList.remove('copied'), 800);
    });
}

function copyAllValid() {
    const copyable = rowsData.filter(r => r.status === 'valid' || r.status === 'wrong');
    if (copyable.length === 0) return alert('No copyable lines');
    
    const all = copyable.map(r => r.output).join('\n');
    
    navigator.clipboard.writeText(all).then(() => {
        playCopyAllSound();
        showPopup('success', 'COPIED!', copyable.length + ' lines copied');
        
        const btn = document.getElementById('copyAllBtn');
        btn.classList.add('copied');
        const orig = btn.innerHTML;
        btn.innerHTML = '✅ COPIED ' + copyable.length + ' LINES!';
        setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('copied'); }, 1500);
    });
}

setInterval(async () => {
    if (rowsData.length === 0) return;
    for (let i = 0; i < rowsData.length; i++) {
        const row = rowsData[i];
        if (row.status !== 'valid') continue;
        try {
            if (isBase32(row.original)) {
                const keyBytes = base32Decode(row.original);
                const newOTP = await generateTOTP(keyBytes);
                if (newOTP !== row.otp) {
                    row.otp = newOTP;
                    const cell = document.getElementById('otp-' + i);
                    if (cell) cell.textContent = newOTP;
                }
            }
        } catch (e) {}
    }
}, 1000);
</script>

</body>
</html>
