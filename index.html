<!DOCTYPE html>
<html>
<head>
<title>Test</title>
</head>
<body style="background:#222;color:#fff;padding:30px;font-family:Arial;text-align:center;">

<h1 style="color:#4ade80;">✅ Test Page</h1>
<p style="font-size:20px;">Jodi ei page ta dekhte pan, tahole GitHub Pages thik ache!</p>

<button onclick="testSound()" style="padding:20px 40px;font-size:20px;background:#1877f2;color:#fff;border:none;border-radius:10px;cursor:pointer;">
Click Me
</button>

<p id="out" style="font-size:18px;margin-top:20px;">Waiting...</p>

<script>
function testSound() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.connect(g);
        g.connect(ctx.destination);
        osc.frequency.value = 880;
        g.gain.value = 0.2;
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
        document.getElementById('out').textContent = '✅ Sound bajlo!';
    } catch(e) {
        document.getElementById('out').textContent = '❌ Error: ' + e.message;
    }
    if (navigator.vibrate) navigator.vibrate(200);
}
</script>

</body>
</html>
