<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2FA Auto Generator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, system-ui, 'Segoe UI', sans-serif;
    background: #0a0e1a;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .app {
    max-width: 420px;
    width: 100%;
  }
  .header {
    text-align: center;
    margin-bottom: 24px;
  }
  .logo {
    font-size: 32px;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 20px;
    color: #38bdf8;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .subtitle {
    font-size: 12px;
    color: #64748b;
  }
  .card {
    background: linear-gradient(145deg, #1e293b, #151c2e);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid #334155;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  label {
    display: block;
    font-size: 12px;
    color: #94a3b8;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  input {
    width: 100%;
    padding: 14px 16px;
    background: #0a0e1a;
    border: 2px solid #334155;
    border-radius: 10px;
    color: #e2e8f0;
    font-size: 16px;
    font-family: 'Courier New', monospace;
    letter-spacing: 2px;
    transition: border-color 0.2s;
  }
  input:focus {
    outline: none;
    border-color: #38bdf8;
    box-shadow: 0 0 0 3px rgba(56,189,248,0.15);
  }
  input::placeholder { color: #475569; letter-spacing: 1px; }
  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 12px;
    transition: transform 0.1s, background 0.2s;
    letter-spacing: 0.5px;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    background: linear-gradient(135deg, #38bdf8, #6366f1);
    color: white;
  }
  .btn-primary:hover { background: linear-gradient(135deg, #0ea5e9, #4f46e5); }
  .btn-secondary {
    background: #334155;
    color: #e2e8f0;
  }
  .btn-secondary:hover { background: #475569; }
  .btn-danger {
    background: #dc2626;
    color: white;
  }
  .btn-danger:hover { background: #b91c1c; }

  /* Code Display */
  .code-card {
    background: linear-gradient(145deg, #0f172a, #0a0e1a);
    border: 2px solid #1e40af;
    border-radius: 16px;
    padding: 28px 20px;
    text-align: center;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .code-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #38bdf8, #818cf8, #38bdf8);
    background-size: 200% 100%;
    animation: shimmer 2s linear infinite;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .code-label {
    font-size: 11px;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 12px;
    font-weight: 600;
  }
  .code-display {
    font-size: 48px;
    font-weight: 800;
    font-family: 'Courier New', monospace;
    letter-spacing: 8px;
    color: #38bdf8;
    margin-bottom: 12px;
    text-shadow: 0 0 20px rgba(56,189,248,0.5);
    user-select: all;
    transition: color 0.3s;
  }
  .code-display.expiring {
    color: #f59e0b;
    text-shadow: 0 0 20px rgba(245,158,11,0.5);
  }
  .code-display.critical {
    color: #ef4444;
    text-shadow: 0 0 20px rgba(239,68,68,0.5);
    animation: pulse 0.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }
  .timer-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 12px;
  }
  .timer-value { color: #38bdf8; font-weight: 700; font-family: 'Courier New', monospace; }
  .progress-track {
    height: 6px;
    background: #1e293b;
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #38bdf8, #818cf8);
    transition: width 0.1s linear;
    border-radius: 3px;
  }
  .progress-fill.warning {
    background: linear-gradient(90deg, #f59e0b, #ef4444);
  }

  /* Quick Actions */
  .quick-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .quick-actions .btn { margin-top: 0; flex: 1; padding: 12px; font-size: 13px; }

  /* Saved Keys */
  .saved-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .saved-title {
    font-size: 13px;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
  }
  .saved-count {
    font-size: 12px;
    background: #1e40af;
    color: white;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 700;
  }
  .saved-key {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    background: #0a0e1a;
    border: 1px solid #334155;
    border-radius: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .saved-key:hover {
    border-color: #38bdf8;
    background: #0f172a;
  }
  .saved-key.active {
    border-color: #38bdf8;
    background: #0f172a;
    box-shadow: 0 0 0 2px rgba(56,189,248,0.2);
  }
  .saved-key-name {
    font-size: 14px;
    font-weight: 600;
    color: #e2e8f0;
  }
  .saved-key-preview {
    font-size: 10px;
    color: #64748b;
    font-family: 'Courier New', monospace;
    margin-top: 2px;
    letter-spacing: 1px;
  }
  .saved-key-del {
    background: transparent;
    border: none;
    color: #64748b;
    cursor: pointer;
    font-size: 16px;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.2s;
  }
  .saved-key-del:hover {
    background: #7f1d1d;
    color: #fecaca;
  }

  /* Status */
  .status {
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 8px;
    margin-top: 12px;
    text-align: center;
    font-weight: 600;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-5px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .status.success { background: #14532d; color: #bbf7d0; border: 1px solid #22c55e; }
  .status.error { background: #7f1d1d; color: #fecaca; border: 1px solid #ef4444; }
  .status.info { background: #1e3a8a; color: #bfdbfe; border: 1px solid #3b82f6; }

  .hidden { display: none !important; }
  .empty-state {
    text-align: center;
    padding: 24px;
    color: #64748b;
    font-size: 13px;
  }

  /* Paste Helper */
  .paste-helper {
    background: #0f172a;
    border: 1px dashed #334155;
    border-radius: 10px;
    padding: 12px;
    margin-top: 12px;
    font-size: 12px;
    color: #94a3b8;
    line-height: 1.6;
  }
  .paste-helper strong { color: #38bdf8; }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="logo">🔐</div>
    <h1>2FA Auto Generator</h1>
    <div class="subtitle">Paste key → Auto generate code</div>
  </div>

  <!-- Add Key -->
  <div class="card">
    <label>Account Name</label>
    <input type="text" id="accountName" placeholder="Facebook / LinkedIn / GitHub" autocomplete="off">

    <label style="margin-top:14px;">Paste 2FA Key</label>
    <input type="text" id="secretInput" placeholder="JBSWY3DPEHPK3PXP" autocomplete="off" spellcheck="false">

    <button class="btn btn-primary" onclick="addKey()">➕ Add & Auto-Generate</button>

    <div class="paste-helper">
      💡 <strong>Tip:</strong> Facebook setup page থেকে key copy করে এখানে paste করুন। App automatically code generate করবে।
    </div>

    <div class="status hidden" id="status"></div>
  </div>

  <!-- Code Display -->
  <div id="codeSection" class="hidden">
    <div class="code-card">
      <div class="code-label" id="activeAccountLabel">TOTP CODE</div>
      <div class="code-display" id="codeDisplay">------</div>
      <div class="timer-row">
        <span>⏱️ Refresh in</span>
        <span class="timer-value" id="timerValue">30.0s</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width:100%"></div>
      </div>
      <div class="quick-actions">
        <button class="btn btn-primary" onclick="copyCode()">📋 Copy</button>
        <button class="btn btn-secondary" onclick="closeCode()">✖ Close</button>
      </div>
    </div>
  </div>

  <!-- Saved Keys -->
  <div class="card hidden" id="savedCard">
    <div class="saved-header">
      <div class="saved-title">💾 Saved Keys</div>
      <div class="saved-count" id="savedCount">0</div>
    </div>
    <div id="savedList"></div>
  </div>

</div>

<script>
// ═══════════════════════════════════════════════════
// Base32 Decode
// ═══════════════════════════════════════════════════
function base32Decode(input) {
  const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
  let cleaned = input.toUpperCase()
    .replace(/\s+/g, "")
    .replace(/-/g, "")
    .replace(/=/g, "");

  if (cleaned.length < 16) throw new Error("Key too short (min 16 chars)");
  if (cleaned.length > 128) throw new Error("Key too long");

  let bits = 0, value = 0;
  const output = [];

  for (const c of cleaned) {
    const idx = alphabet.indexOf(c);
    if (idx === -1) throw new Error("Invalid Base32 character: " + c);
    value = (value << 5) | idx;
    bits += 5;
    if (bits >= 8) {
      output.push((value >>> (bits - 8)) & 0xFF);
      bits -= 8;
    }
  }
  return new Uint8Array(output);
}

// ═══════════════════════════════════════════════════
// TOTP Generation
// ═══════════════════════════════════════════════════
async function generateTOTP(secret, timeMs = Date.now()) {
  const keyBytes = base32Decode(secret);
  const counter = Math.floor(timeMs / 1000 / 30);

  const counterBytes = new Uint8Array(8);
  let temp = counter;
  for (let i = 7; i >= 0; i--) {
    counterBytes[i] = temp & 0xFF;
    temp = Math.floor(temp / 256);
  }

  const key = await crypto.subtle.importKey(
    "raw", keyBytes,
    { name: "HMAC", hash: "SHA-1" },
    false, ["sign"]
  );
  const hash = new Uint8Array(await crypto.subtle.sign("HMAC", key, counterBytes));

  const offset = hash[hash.length - 1] & 0x0F;
  const binary =
    ((hash[offset]     & 0x7F) << 24) |
    ((hash[offset + 1] & 0xFF) << 16) |
    ((hash[offset + 2] & 0xFF) << 8)  |
    ((hash[offset + 3] & 0xFF));

  return (binary % 1000000).toString().padStart(6, "0");
}

// ═══════════════════════════════════════════════════
// Storage (LocalStorage — simple)
// ═══════════════════════════════════════════════════
const STORAGE_KEY = "totp_keys_v1";

function loadKeys() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  } catch (e) {
    return [];
  }
}

function saveKeys(keys) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(keys));
}

// ═══════════════════════════════════════════════════
// App State
// ═══════════════════════════════════════════════════
let keys = loadKeys();
let activeKey = null;      // { name, secret, id }
let tickInterval = null;

// ═══════════════════════════════════════════════════
// UI Functions
// ═══════════════════════════════════════════════════
function showStatus(msg, type = "info") {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = "status " + type;
  el.classList.remove("hidden");
  setTimeout(() => el.classList.add("hidden"), 3000);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// ═══════════════════════════════════════════════════
// Add Key
// ═══════════════════════════════════════════════════
async function addKey() {
  const name = document.getElementById("accountName").value.trim();
  const secret = document.getElementById("secretInput").value.trim().toUpperCase();

  if (!name) return showStatus("❌ Account name required", "error");
  if (!secret) return showStatus("❌ Paste the key", "error");

  // Validate
  try {
    base32Decode(secret);
  } catch (e) {
    return showStatus("❌ " + e.message, "error");
  }

  // Save
  const id = Date.now();
  keys.push({ id, name, secret });
  saveKeys(keys);

  document.getElementById("accountName").value = "";
  document.getElementById("secretInput").value = "";

  showStatus("✅ Key saved! Code generating...", "success");

  renderSaved();
  showCode({ id, name, secret });
}

// ═══════════════════════════════════════════════════
// Show Code (AUTO-GENERATE)
// ═══════════════════════════════════════════════════
function showCode(key) {
  activeKey = key;
  document.getElementById("codeSection").classList.remove("hidden");
  document.getElementById("activeAccountLabel").textContent = key.name.toUpperCase();

  // Highlight active in saved list
  renderSaved();

  // Start tick loop
  clearInterval(tickInterval);
  tick();
  tickInterval = setInterval(tick, 100);
}

function closeCode() {
  activeKey = null;
  clearInterval(tickInterval);
  tickInterval = null;
  document.getElementById("codeSection").classList.add("hidden");
  renderSaved();
}

// ═══════════════════════════════════════════════════
// Tick — auto-refresh code every 30s
// ═══════════════════════════════════════════════════
async function tick() {
  if (!activeKey) return;

  try {
    const code = await generateTOTP(activeKey.secret);
    const display = document.getElementById("codeDisplay");
    display.textContent = code.slice(0, 3) + " " + code.slice(3);

    const now = Date.now();
    const remaining = 30 - (now / 1000) % 30;

    document.getElementById("timerValue").textContent = remaining.toFixed(1) + "s";

    const pct = (remaining / 30) * 100;
    const fill = document.getElementById("progressFill");
    fill.style.width = pct + "%";

    // Color-coded warnings
    display.classList.remove("expiring", "critical");
    fill.classList.remove("warning");

    if (remaining <= 5) {
      display.classList.add("critical");
      fill.classList.add("warning");
    } else if (remaining <= 10) {
      display.classList.add("expiring");
      fill.classList.add("warning");
    }
  } catch (e) {
    document.getElementById("codeDisplay").textContent = "ERROR";
  }
}

// ═══════════════════════════════════════════════════
// Copy Code
// ═══════════════════════════════════════════════════
async function copyCode() {
  const code = document.getElementById("codeDisplay").textContent.replace(/\s/g, "");
  if (!/^\d{6}$/.test(code)) return;

  try {
    await navigator.clipboard.writeText(code);
    showStatus("✅ Code copied: " + code, "success");
  } catch (e) {
    // Fallback
    const ta = document.createElement("textarea");
    ta.value = code;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    showStatus("✅ Code copied", "success");
  }
}

// ═══════════════════════════════════════════════════
// Render Saved Keys
// ═══════════════════════════════════════════════════
function renderSaved() {
  const card = document.getElementById("savedCard");
  const list = document.getElementById("savedList");
  const count = document.getElementById("savedCount");

  if (keys.length === 0) {
    card.classList.add("hidden");
    return;
  }

  card.classList.remove("hidden");
  count.textContent = keys.length;

  list.innerHTML = keys.map(k => {
    const preview = k.secret.slice(0, 4) + " " + k.secret.slice(4, 8) + " ...";
    const isActive = activeKey && activeKey.id === k.id;
    return `
      <div class="saved-key ${isActive ? 'active' : ''}" onclick='showCodeById(${k.id})'>
        <div>
          <div class="saved-key-name">${escapeHtml(k.name)}</div>
          <div class="saved-key-preview">${preview}</div>
        </div>
        <button class="saved-key-del" onclick="event.stopPropagation(); deleteKey(${k.id})">🗑</button>
      </div>
    `;
  }).join("");
}

function showCodeById(id) {
  const key = keys.find(k => k.id === id);
  if (key) showCode(key);
}

function deleteKey(id) {
  if (!confirm("Delete this key?")) return;
  keys = keys.filter(k => k.id !== id);
  saveKeys(keys);
  if (activeKey && activeKey.id === id) closeCode();
  renderSaved();
  showStatus("🗑 Deleted", "info");
}

// ═══════════════════════════════════════════════════
// Init
// ═══════════════════════════════════════════════════
window.addEventListener("load", () => {
  renderSaved();
});

// Clear sensitive data on close
window.addEventListener("beforeunload", () => {
  activeKey = null;
  clearInterval(tickInterval);
});
</script>
</body>
</html>
