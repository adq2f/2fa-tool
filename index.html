<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facebook 2FA Tool</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        margin: 0;
        padding: 20px;
        background: linear-gradient(rgba(5, 10, 25, 0.88), rgba(5, 10, 25, 0.95)),
            url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=1920&q=80') center/cover no-repeat fixed;
    }
    .container {
        background: rgba(255, 255, 255, 0.98);
        padding: 25px;
        border-radius: 18px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        width: 100%;
        max-width: 480px;
        margin-top: 20px;
    }
    .header { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 20px; }
    .fb-icon { width: 42px; height: 42px; filter: drop-shadow(0 4px 10px rgba(24,119,242,0.5)); }
    h2 { color: #1877f2; margin: 0; font-size: 24px; font-weight: 800; }
    .mode-tabs { display: flex; background: #f0f2f5; border-radius: 10px; padding: 4px; margin-bottom: 18px; gap: 4px; }
    .mode-tab { flex: 1; padding: 10px 6px; border-radius: 7px; cursor: pointer; font-size: 10px; font-weight: bold; color: #666; border: none; background: transparent; text-transform: uppercase; letter-spacing: 0.3px; font-family: inherit; transition: 0.3s; }
    .mode-tab.active { background: #1877f2; color: #fff; box-shadow: 0 3px 10px rgba(24,119,242,0.4); }
    .mode-panel { display: none; }
    .mode-panel.active { display: block; }
    .section { margin-bottom: 18px; }
    .input-row { display: flex; align-items: stretch; gap: 8px; }
    .paste-btn { background: #1877f2; color: #fff; border: none; border-radius: 8px; padding: 0 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(24,119,242,0.4); flex-shrink: 0; transition: 0.3s; }
    .paste-btn:hover { background: #0a4d9e; }
    .paste-btn.copied { background: #17a2b8 !important; }
    .input-wrap { flex: 1; position: relative; min-width: 0; }
    .input-label { position: absolute; top: 5px; left: 12px; font-size: 8px; font-weight: bold; color: #1877f2; text-transform: uppercase; z-index: 2; opacity: 0.85; }
    input { width: 100%; height: 100%; padding: 22px 12px 8px 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; font-family: 'Courier New', monospace; outline: none; min-height: 56px; transition: 0.3s; }
    input::placeholder { font-size: 11px; opacity: 0.55; }
    input:focus { border-color: #1877f2; box-shadow: 0 0 0 3px rgba(24,119,242,0.15); }
    input.has-key { color: #dc3545 !important; font-weight: bold; border-color: #dc3545; background: #fff5f5; }
    .otp-btn { background: #6c757d; color: #fff; border: none; border-radius: 8px; padding: 6px 10px 8px 10px; cursor: pointer; min-width: 130px; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.3s; }
    .otp-btn.active { background: #28a745; box-shadow: 0 4px 12px rgba(40,167,69,0.4); }
    .otp-btn.active:hover { background: #1e7e34; }
    .otp-btn.copied { background: #17a2b8 !important; }
    .otp-btn.wrong { background: #dc3545; }
    .otp-btn:disabled { cursor: not-allowed; opacity: 0.7; }
    .otp-label-inside { font-size: 8px; font-weight: bold; color: rgba(255,255,255,0.9); text-transform: uppercase; align-self: flex-end; padding-right: 2px; }
    .otp-content { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 17px; font-weight: bold; font-family: 'Courier New', monospace; }
    .copy-icon { width: 14px; height: 14px; }
    .output-wrap { border: 2px dashed #28a745; border-radius: 8px; background: #f0fff4; padding: 8px 10px 10px 10px; transition: 0.3s; }
    .output-wrap.wrong { background: #ffe6e6 !important; border-color: #dc3545 !important; }
    .output-wrap.orange { background: #fff4e6 !important; border-color: #fd7e14 !important; }
    .output-label-inside { font-size: 8px; font-weight: bold; color: #28a745; text-transform: uppercase; display: block; margin-bottom: 4px; transition: 0.3s; }
    .output-wrap.wrong .output-label-inside { color: #dc3545; }
    .output-wrap.orange .output-label-inside { color: #fd7e14; }
    .output-box { padding: 6px 8px; font-size: 14px; font-family: 'Courier New', monospace; word-break: break-all; color: #155724; font-weight: bold; background: rgba(255,255,255,0.7); border-radius: 5px; min-height: 30px; display: flex; align-items: center; }
    .output-box.wrong { color: #dc3545 !important; justify-content: center; }
    .output-box.orange { color: #fd7e14 !important; justify-content: center; }
    .btn-copy-inside { width: 100%; margin-top: 8px; padding: 8px 10px; background: #28a745; color: #fff; border: none; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px; text-transform: uppercase; transition: 0.3s; }
    .btn-copy-inside:hover { background: #1e7e34; }
    .btn-copy-inside:disabled { background: #999; cursor: not-allowed; }
    .btn-copy-inside.copied { background: #17a2b8 !important; }
    .progress-bar { width: 100%; height: 4px; background: #ddd; border-radius: 3px; overflow: hidden; margin-top: 8px; }
    .progress-fill { height: 100%; background: #28a745; width: 100%; transition: width 1s linear, background-color 0.5s; }
    .timer { font-size: 12px; color: #666; font-weight: bold; }
    .timer.wrong { color: #dc3545; }
    .timer.orange { color: #fd7e14; }
    hr { border: none; border-top: 1px solid #eee; margin: 20px 0; }
    .coming-soon { text-align: center; padding: 60px 20px; background: #fff5f5; border-radius: 12px; border: 2px dashed #dc3545; }
    .coming-soon h3 { color: #dc3545; font-size: 28px; font-weight: 900; letter-spacing: 2px; margin: 0 0 12px 0; text-transform: uppercase; animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.05); } }
    .coming-soon p { color: #666; font-size: 14px; margin: 0; }
    .coming-soon .icon-lock { width: 60px; height: 60px; margin-bottom: 15px; stroke: #dc3545; }
    .popup { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-150px); color: #fff; padding: 14px 22px; border-radius: 14px; font-weight: bold; display: flex; align-items: center; gap: 12px; z-index: 9999; opacity: 0; transition: all 0.5s; pointer-events: none; min-width: 240px; max-width: 90%; }
    .popup.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .popup.green { background: linear-gradient(135deg, #28a745, #1e7e34); box-shadow: 0 12px 40px rgba(40,167,69,0.6); }
    .popup.red { background: linear-gradient(135deg, #dc3545, #a71e2a); box-shadow: 0 12px 40px rgba(220,53,69,0.6); }
    .popup.orange { background: linear-gradient(135deg, #fd7e14, #c25a04); box-shadow: 0 12px 40px rgba(253,126,20,0.6); }
    .popup-icon { width: 30px; height: 30px; flex-shrink: 0; }
    .popup-text { display: flex; flex-direction: column; line-height: 1.3; }
    .popup-title { font-size: 13px; text-transform: uppercase; }
    .popup-code { font-size: 22px; font-family: 'Courier New', monospace; letter-spacing: 4px; margin-top: 3px; }
    .popup-msg { font-size: 13px; margin-top: 2px; }
</style>
</head>
<body>

<div class="popup" id="popup">
    <svg class="popup-icon" id="popupIcon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3">
        <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <div class="popup-text">
        <span class="popup-title" id="popupTitle">2FA CODE GENERATED!</span>
        <span class="popup-code" id="popupCode">------</span>
        <span class="popup-msg" id="popupMsg" style="display:none;"></span>
    </div>
</div>

<div class="container">
    <div class="header">
        <svg class="fb-icon" viewBox="0 0 64 64">
            <defs>
                <linearGradient id="fbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#4292ff"/>
                    <stop offset="50%" stop-color="#1877f2"/>
                    <stop offset="100%" stop-color="#0a4d9e"/>
                </linearGradient>
            </defs>
            <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#fbGrad)"/>
            <path d="M 42 20 L 36 20 C 32 20 30 22 30 26 L 30 30 L 26 30 L 26 36 L 30 36 L 30 50 L 37 50 L 37 36 L 42 36 L 43 30 L 37 30 L 37 27 C 37 26 37.5 25.5 38.5 25.5 L 42 25.5 Z" fill="#ffffff"/>
        </svg>
        <h2>2FA Tool</h2>

    <div class="mode-tabs">
        <button class="mode-tab active" id="tabMode1" onclick="switchMode(1)">2FA → Base64-2FA</button>
        <button class="mode-tab" id="tabMode2" onclick="switchMode(2)">Base64-2FA → 2FA</button>
    </div>

    <div class="mode-panel active" id="panelMode1">
        <div class="section">
            <div style="text-align:right;margin-bottom:6px;">
                <span class="timer" id="timer1">⏱ 30s</span>
            </div>
            <div class="input-row">
                <button class="paste-btn" id="pasteBtn1" onclick="pasteKey(1)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>

                <div class="input-wrap">
                    <span class="input-label">PASTE 2FA KEY</span>
                    <input type="text" id="inputKey1" placeholder="2FA key only" autocomplete="off" spellcheck="false">
                </div>
                <button class="otp-btn" id="otpBtn1" onclick="copyOTP(1)" disabled>
                    <span class="otp-label-inside">COPY 2FA CODE</span>
                    <span class="otp-content">
                        <svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
                            <rect x="9" y="9" width="13" height="13" rx="2"/>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>

                        <span id="otpText1">------</span>
                    </span>

            </div>
            <div class="progress-bar"><div class="progress-fill" id="progress1"></div></div>
        </div>
        <hr>
        <div class="section">
            <div class="output-wrap" id="outputWrap1">
                <span class="output-label-inside" id="outputLabel1">BASE64-2FA KEY</span>
                <div class="output-box" id="newKeyBox1">—</div>
                <button class="btn-copy-inside" id="copyKeyBtn1" onclick="copyNewKey(1)" disabled>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
                        <rect x="9" y="9" width="13" height="13" rx="2"/>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                    </svg>
                    COPY BASE64-2FA KEY
                </button>
            </div>
        </div>

    <div class="mode-panel" id="panelMode2">
        <div class="coming-soon">
            <svg class="icon-lock" viewBox="0 0 24 24" fill="none" stroke="#dc3545" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>

            <h3>Coming Soon</h3>
            <p>This feature is under development</p>
        </div>
    </div>
</div>

<script>
function base32Decode(base32) {
    const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
    base32 = base32.toUpperCase().replace(/=+$/, '').replace(/\s/g, '');
    if (!base32.length) throw new Error('Empty');
    let bits = '';
    for (let i = 0; i < base32.length; i++) {
        const v = alphabet.indexOf(base32[i]);
        if (v === -1) throw new Error('Invalid');
        bits += v.toString(2).padStart(5, '0');
    }
    const bytes = [];
    for (let i = 0; i + 8 <= bits.length; i += 8) {
        bytes.push(parseInt(bits.substr(i, 8), 2));
    }
    if (!bytes.length) throw new Error('Invalid');
    return new Uint8Array(bytes);
}

function base64Encode(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    bytes.forEach(b => bin += String.fromCharCode(b));
    return btoa(bin);
}

function isBase64Input(str) {
    const clean = str.replace(/\s/g, '');
    return /[a-z]/.test(clean) || /[+/]/.test(clean);
}

async function hmacSHA1(key, message) {
    const ck = await crypto.subtle.importKey('raw', key, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
    return new Uint8Array(await crypto.subtle.sign('HMAC', ck, message));
}

async function generateTOTP(keyBytes) {
    const epoch = Math.floor(Date.now() / 1000);
    const counter = Math.floor(epoch / 30);
    const buffer = new ArrayBuffer(8);
    const view = new DataView(buffer);
    view.setUint32(4, counter, false);
    const hmac = await hmacSHA1(keyBytes, buffer);
    const offset = hmac[hmac.length - 1] & 0x0f;
    const binary = ((hmac[offset] & 0x7f) << 24) | ((hmac[offset + 1] & 0xff) << 16) | ((hmac[offset + 2] & 0xff) << 8) | (hmac[offset + 3] & 0xff);
    return (binary % 1000000).toString().padStart(6, '0');
}

const popup = document.getElementById('popup');
const popupCode = document.getElementById('popupCode');
const popupTitle = document.getElementById('popupTitle');
const popupMsg = document.getElementById('popupMsg');
const popupIcon = document.getElementById('popupIcon');

const inputEl1 = document.getElementById('inputKey1');
const otpBtn1 = document.getElementById('otpBtn1');
const otpText1 = document.getElementById('otpText1');
const newKeyBox1 = document.getElementById('newKeyBox1');
const outputWrap1 = document.getElementById('outputWrap1');
const outputLabel1 = document.getElementById('outputLabel1');
const timerEl1 = document.getElementById('timer1');
const progress1 = document.getElementById('progress1');
const copyKeyBtn1 = document.getElementById('copyKeyBtn1');
const pasteBtn1 = document.getElementById('pasteBtn1');

let currentNewKey1 = '', currentOTP1 = '', isValid1 = false;
let soundCount1 = 0, lastSoundOTP1 = '', lastKeyInput1 = '';
let popupTimer = null;

function switchMode(mode) {
    document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.mode-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('tabMode' + mode).classList.add('active');
    document.getElementById('panelMode' + mode).classList.add('active');

    if (mode === 2) {
        vibrate();
        showComingSoonPopup();
    }
}

function vibrate() {
    if (navigator.vibrate) {
        navigator.vibrate([200, 100, 200, 100, 200]);
    }
}

function playSound() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const masterGain = ctx.createGain();
        masterGain.gain.setValueAtTime(0.18, ctx.currentTime);
        masterGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
        masterGain.connect(ctx.destination);

        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(880, ctx.currentTime);
        osc1.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.12);
        gain1.gain.setValueAtTime(0.7, ctx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        osc1.connect(gain1);
        gain1.connect(masterGain);

        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(1760, ctx.currentTime);
        osc2.frequency.exponentialRampToValueAtTime(2200, ctx.currentTime + 0.12);
        gain2.gain.setValueAtTime(0.3, ctx.currentTime);
        gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc2.connect(gain2);
        gain2.connect(masterGain);

        osc1.start(ctx.currentTime);
        osc2.start(ctx.currentTime);
        osc1.stop(ctx.currentTime + 0.4);
        osc2.stop(ctx.currentTime + 0.4);
        setTimeout(() => ctx.close(), 800);
    } catch (e) {}
}

function showSuccessPopup(code) {
    popup.className = 'popup green';
    popupTitle.textContent = '2FA CODE GENERATED!';
    popupCode.textContent = code;
    popupCode.style.display = 'block';
    popupMsg.style.display = 'none';
    popupIcon.innerHTML = '<polyline points="20 6 9 17 4 12"></polyline>';
    popup.classList.add('show');
    playSound();
    if (popupTimer) clearTimeout(popupTimer);
    popupTimer = setTimeout(() => popup.classList.remove('show'), 5000);
}

function showComingSoonPopup() {
    popup.className = 'popup red';
    popupTitle.textContent = 'COMING SOON!';
    popupCode.style.display = 'none';
    popupMsg.style.display = 'block';
    popupMsg.textContent = 'This feature is under development';
    popupIcon.innerHTML = '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>';
    popup.classList.add('show');
    playSound();
    if (popupTimer) clearTimeout(popupTimer);
    popupTimer = setTimeout(() => popup.classList.remove('show'), 4000);
}

function showGoToPopup(target) {
    popup.className = 'popup orange';
    popupTitle.textContent = 'WRONG CONVERTER!';
    popupCode.style.display = 'none';
    popupMsg.style.display = 'block';
    popupMsg.textContent = 'Go to ' + target;
    popupIcon.innerHTML = '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>';
    popup.classList.add('show');
    playSound();
    if (popupTimer) clearTimeout(popupTimer);
    popupTimer = setTimeout(() => popup.classList.remove('show'), 4000);
}

async function pasteKey(mode) {
    try {
        const text = await navigator.clipboard.readText();
        if (text) {
            inputEl1.value = text.trim();
            inputEl1.dispatchEvent(new Event('input'));
            pasteBtn1.classList.add('copied');
            setTimeout(() => pasteBtn1.classList.remove('copied'), 800);
        }
    } catch (e) {
        inputEl1.focus();
    }
}

async function updateMode1() {
    const input = inputEl1.value;

    if (!input || !input.trim()) {
        inputEl1.classList.remove('has-key');
        otpText1.textContent = '------';
        otpBtn1.classList.remove('wrong', 'copied', 'active');
        otpBtn1.disabled = true;
        newKeyBox1.textContent = '—';
        newKeyBox1.classList.remove('wrong', 'orange');
        outputWrap1.classList.remove('wrong', 'orange');
        outputLabel1.textContent = 'BASE64-2FA KEY';
        progress1.style.background = '#28a745';
        timerEl1.classList.remove('wrong', 'orange');
        currentNewKey1 = currentOTP1 = '';
        isValid1 = false;
        copyKeyBtn1.disabled = true;
        soundCount1 = 0; lastSoundOTP1 = ''; lastKeyInput1 = '';
        return;
    }

    if (input !== lastKeyInput1) {
        lastKeyInput1 = input;
        soundCount1 = 0; lastSoundOTP1 = '';
    }

    inputEl1.classList.add('has-key');

    if (isBase64Input(input)) {
        otpText1.textContent = 'Wrong';
        otpBtn1.classList.remove('active');
        otpBtn1.classList.add('wrong');
        otpBtn1.disabled = true;
        newKeyBox1.textContent = 'Go to Base64-2FA → 2FA';
        newKeyBox1.classList.remove('wrong');
        newKeyBox1.classList.add('orange');
        outputWrap1.classList.remove('wrong');
        outputWrap1.classList.add('orange');
        outputLabel1.textContent = 'WRONG CONVERTER';
        progress1.style.background = '#fd7e14';
        timerEl1.classList.remove('wrong');
        timerEl1.classList.add('orange');
        currentNewKey1 = currentOTP1 = '';
        isValid1 = false;
        copyKeyBtn1.disabled = true;

        if (input !== lastSoundOTP1) {
            lastSoundOTP1 = input;
            showGoToPopup('Base64-2FA → 2FA');
        }
        return;
    }

    let keyBytes = null;
    try {
        keyBytes = base32Decode(input);
    } catch (e) {
        keyBytes = null;
    }

    if (!keyBytes) {
        otpText1.textContent = 'Wrong 2FA';
        otpBtn1.classList.remove('active');
        otpBtn1.classList.add('wrong');
        otpBtn1.disabled = true;
        newKeyBox1.textContent = 'Wrong 2FA';
        newKeyBox1.classList.remove('orange');
        newKeyBox1.classList.add('wrong');
        outputWrap1.classList.remove('orange');
        outputWrap1.classList.add('wrong');
        outputLabel1.textContent = 'BASE64-2FA KEY';
        progress1.style.background = '#dc3545';
        timerEl1.classList.remove('orange');
        timerEl1.classList.add('wrong');
        currentNewKey1 = currentOTP1 = '';
        isValid1 = false;
        copyKeyBtn1.disabled = true;
        return;
    }

    try {
        currentOTP1 = await generateTOTP(keyBytes);
        otpText1.textContent = currentOTP1;
        otpBtn1.classList.remove('wrong');
        otpBtn1.classList.add('active');
        otpBtn1.disabled = false;
        isValid1 = true;
    } catch (e) {
        otpText1.textContent = 'Wrong 2FA';
        otpBtn1.classList.remove('active');
        otpBtn1.classList.add('wrong');
        otpBtn1.disabled = true;
        newKeyBox1.textContent = 'Wrong 2FA';
        newKeyBox1.classList.add('wrong');
        outputWrap1.classList.add('wrong');
        currentNewKey1 = currentOTP1 = '';
        isValid1 = false;
        copyKeyBtn1.disabled = true;
        return;
    }

    currentNewKey1 = base64Encode(input);
    newKeyBox1.textContent = currentNewKey1;
    newKeyBox1.classList.remove('wrong', 'orange');
    outputWrap1.classList.remove('wrong', 'orange');
    outputLabel1.textContent = 'BASE64-2FA KEY';
    timerEl1.classList.remove('wrong', 'orange');
    copyKeyBtn1.disabled = false;

    const remaining = 30 - (Math.floor(Date.now() / 1000) % 30);
    timerEl1.textContent = '⏱ ' + remaining + 's';
    progress1.style.width = (remaining / 30 * 100) + '%';

    if (remaining > 15) progress1.style.background = '#28a745';
    else if (remaining > 4.5) progress1.style.background = '#fd7e14';
    else progress1.style.background = '#dc3545';

    if (currentOTP1 !== lastSoundOTP1 && soundCount1 < 2) {
        lastSoundOTP1 = currentOTP1;
        soundCount1++;
        showSuccessPopup(currentOTP1);
    } else {
        popupCode.textContent = currentOTP1;
    }
}

function copyText(text, btn, isOTP) {
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
        btn.classList.add('copied');
        if (isOTP) {
            otpText1.textContent = 'Copied!';
            setTimeout(() => {
                otpText1.textContent = currentOTP1;
                btn.classList.remove('copied');
            }, 1000);
        } else {
            const orig = btn.innerHTML;
            btn.innerHTML = 'COPIED!';
            setTimeout(() => {
                btn.innerHTML = orig;
                btn.classList.remove('copied');
            }, 1200);
        }
    });
}

function copyNewKey(mode) { copyText(currentNewKey1, copyKeyBtn1, false); }
function copyOTP(mode) { copyText(currentOTP1, otpBtn1, true); }

inputEl1.addEventListener('input', updateMode1);
setInterval(updateMode1, 1000);
updateMode1();
</script>
